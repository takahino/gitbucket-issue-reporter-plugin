name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
    branches: ["**"]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: "11"
          distribution: "temurin"

      - name: Set up sbt
        uses: sbt/setup-sbt@v1

      - name: Run tests
        run: sbt test

      - name: Build fat JAR (POI bundled)
        run: sbt assembly

      - name: Build thin JAR (POI excluded)
        run: sbt -Dthin=true assembly

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: plugin-jar
          path: target/scala-2.13/gitbucket-issue-reporter-plugin-*.jar

  release:
    needs: test-and-build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: "11"
          distribution: "temurin"

      - name: Set up sbt
        uses: sbt/setup-sbt@v1

      - name: Build fat JAR (POI bundled)
        run: sbt assembly

      - name: Save fat JAR
        run: cp target/scala-2.13/gitbucket-issue-reporter-plugin-*.jar /tmp/fat.jar

      - name: Build thin JAR (POI excluded)
        run: sbt -Dthin=true assembly

      - name: Restore fat JAR
        run: |
          VERSION=$(ls target/scala-2.13/gitbucket-issue-reporter-plugin-*-thin.jar | sed 's/.*plugin-\(.*\)-thin.jar/\1/')
          cp /tmp/fat.jar target/scala-2.13/gitbucket-issue-reporter-plugin-${VERSION}.jar

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: target/scala-2.13/gitbucket-issue-reporter-plugin-*.jar
